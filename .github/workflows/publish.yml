name: publish

# Releases are cut by pushing the tag `npm version` creates:
#
#   npm version patch && git push --follow-tags
#
# Publishing never happens from a laptop, so what reaches npm is always what is
# in the tagged commit.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm provenance: npm signs the published tarball with a
      # short-lived OIDC token, so the npm page can show which repository and
      # commit built it.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag against package.json and CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          if ! grep -qF "## $VERSION" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $VERSION' entry"
            exit 1
          fi

      - run: npm ci

      # `prepublishOnly` runs the tests and the build, so a red test cannot ship.
      # `access: public` already lives in publishConfig.
      #
      # Needs an automation token in the NPM_TOKEN secret. Configuring trusted
      # publishing for this package on npmjs.com lets the OIDC token above do
      # the authenticating too, and the secret can then be deleted.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
